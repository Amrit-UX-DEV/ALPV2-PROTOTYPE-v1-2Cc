<!-- ===== Icon rail: always-visible button strip ===== -->
<div class="ui-action-rail">
  <div class="ui-menu-action-block search">
    <button class="ui-menu-action tier-0"> <span class="details"><i class="fa fa-home" aria-hidden="true"></i>
    </span> <span class="tooltip">Home</span> </button>
  </div>
  <div class="ui-menu-action-block search ui-menu-action-block--divider">
    <button class="ui-menu-action tier-0" alpha-ui-event="click" alpha-ui-attr-toggle=".ux-toolbar-example ,extended">
    <span class="details"><i class="fa fa-search" aria-hidden="true"></i> </span>
    <span class="tooltip">Search ALPHA</span> </button>
  </div>

  <div class="ui-menu-action-block group-summary">
    <button class="ui-menu-action tier-0" [class.active]="currentView === 'group-summary'" (click)="switchView('group-summary')">
    <span class="details"><i class="fa fa-users" aria-hidden="true"></i> </span>
    <span class="tooltip">Group Summary </span> </button>
  </div>
  <div class="ui-menu-action-block group-summary ui-menu-action-block--divider">
    <button class="ui-menu-action tier-0"> <span class="details"><i class="fa fa-bars" aria-hidden="true"></i>
    </span> <span class="tooltip">Enquiry</span> </button>
  </div>
  <div class="ui-menu-action-block business-processes">
    <button class="ui-menu-action tier-0" [class.active]="currentView === 'work-plan'" (click)="switchView('work-plan')">
    <span class="details"><i class="fas fa-clipboard-list toolbar-icon--clipboard"></i> </span>
    <span class="tooltip">Business Processes</span> </button>
  </div>




















</div>
<!-- ===== Slide-out search panel: toggled by the rail's search button ===== -->
<div class="ui-action-menu-extended">
  <div class="header-block">
    <span class="app-toolbar--heading">
    <img src="../../images/alpha-icon-72.png" class="app-icon" alt="Alpha"><strong>Search</strong>
    </span>
  </div>
  <ul>
    <alpha-search-field>
      <li class="alpha-accordion-parent" routerlinkactive="alpha-selected" alpha-data-inspector="NaN">
        <a title="Search"> <span>Search</span> <span class="alpha-openclose"></span>
        <span class="alpha-openclose"></span></a> <ul class="alpha-accordion-children"> <li>
        <div class="container-fluid toolbar-searchform"> <form class="primary-field" novalidate="" (submit)="onSearch($event)">
        <div class="form-group"> <label for="MenuSearch_SearchCriteria">Search Criteria</label>
        <select class="form-control" formcontrolname="searchCriteria" id="MenuSearch_SearchCriteria" [value]="search.criteria()" (change)="onCriteriaChange($event)">
        <!-- The same criteria as the call centre form, in the same order: both forms
         bind to the one criteria, so a value missing here, or a different order,
         would show as a blank or misleading dropdown. -->
        <!----> <option value="Policy">Policy</option>
        <option value="Agent">Agent</option>
        <option value="Client">Client</option>
        <option value="Company">Company</option>
        <option value="Unallocated Payment">Unallocated Payment</option>
        <option value="Possible Match">Possible Match</option>
        <option value="Other">Other</option> </select> </div> <div class="form-group">
        <label for="MenuSearch_ReferenceNumber">Reference Number</label>
        <input autocomplete="off" autofocus="" class="form-control" formcontrolname="referenceNumber" id="MenuSearch_ReferenceNumber" name="referenceNumber" type="input" [placeholder]="search.referencePlaceholder()" [value]="search.term()" (input)="onReferenceInput($event)" [attr.aria-describedby]="search.criteriaHint() ? 'MenuSearch_ReferenceHelp' : null">
        </div>
        <!-- Under the field it is about, so it is read before anything is keyed
             rather than after a search has already failed. Both search forms
             show the same hint, from the one service.

             The note is left in the block empty so that it is a live region
             already on the page when a message goes into it, which is what has
             it read out without taking focus off the field. -->
        @if (search.criteriaHint(); as hint) {
        <div class="alp-notice alp-notice--info" id="MenuSearch_ReferenceHelp">
          <i aria-hidden="true" class="alp-notice__icon fas fa-info-circle"></i>
          <p class="alp-notice__text">{{ hint }}</p>
          <strong class="alp-notice__note" [class.is-shown]="!!search.criteriaNote()" aria-live="polite">{{ search.criteriaNote() }}</strong>
        </div>
        }
        <button class="btn btn-success policy-search-submit" id="MenuSearch_SearchButton" type="submit" [disabled]="!search.canSearch()">Search</button>
        <button class="btn btn-danger policy-search-clear" id="MenuSearch_ClearButton" type="button" (click)="search.clear()">Clear</button>
        @if (search.showNotFoundBlock()) {
        <div class="notification-block status-warning">
          <div class="notification-message">
            <p>No {{ search.notFoundLabel() }} found for {{ search.notFoundTerm() }}</p>
          </div>
        </div>
        }
        </form> </div> </li> </ul>
      </li>
    </alpha-search-field>
  </ul>
</div>

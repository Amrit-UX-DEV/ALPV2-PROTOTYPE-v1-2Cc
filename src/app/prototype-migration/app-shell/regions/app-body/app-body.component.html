      <router-outlet></router-outlet>
      
      <!-- GROUP SUMMARY HERE -->
      <!-- Content Area -->
    <div [ngSwitch]="currentView">
        <ng-container *ngSwitchCase="'group-summary'">
            @if (ctx.hasPolicy()) {
                <alpha-group-summary></alpha-group-summary>
            } @else {
                <div class="alp-no-context">
                    <h2>{{ ctx.label() }}</h2>
                </div>
            }
        </ng-container>
        <ng-container *ngSwitchCase="'search-summary'">
            @if (ctx.kind() === 'possible-match') {
                <alpha-search-summary></alpha-search-summary>
            } @else {
                <div class="alp-no-context">
                    <h2>{{ ctx.label() }}</h2>
                </div>
            }
        </ng-container>
        <alpha-work-plan-hub *ngSwitchCase="'work-plans'"></alpha-work-plan-hub>
        <!-- Whichever plan the hub opened, and the same shell for all of them.
             Exiting or finishing goes back to the hub, because the shell cannot
             know where a rep came from and the hub is the only way in. -->
        <wizard-shell *ngSwitchCase="'work-plan'" [configUrl]="plans.configUrl()" (exit)="plans.close()">
        </wizard-shell>
    </div>

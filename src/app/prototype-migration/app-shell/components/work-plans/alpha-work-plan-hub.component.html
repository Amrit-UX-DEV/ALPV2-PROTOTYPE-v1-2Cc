<div class="alp-work-plans">
  <h2 class="alp-work-plans__title">{{ plans.heading() }}</h2>

  @if (plans.plans().length) {
    <!-- A list, because that is what it is: two work plans now, and the next one
         is an entry in the index rather than a change here. -->
    <ul class="alp-work-plans__list">
      @for (plan of plans.plans(); track plan.id) {
        <li class="alp-work-plans__item">
          <button type="button" class="alp-launch-tile" (click)="plans.open(plan)">
            <span class="alp-launch-tile__icon">
              <i aria-hidden="true" [class]="plan.icon"></i>
            </span>
            <span class="alp-launch-tile__name">{{ plan.name }}</span>
            <i aria-hidden="true" class="alp-launch-tile__chevron fa fa-chevron-right"></i>
          </button>
        </li>
      }
    </ul>
  } @else {
    <div class="alp-notice alp-notice--warning" role="alert">
      <i aria-hidden="true" class="alp-notice__icon fas fa-exclamation-triangle"></i>
      <strong class="alp-notice__text">No work plans could be read.</strong>
    </div>
  }
</div>

<div class="alp-dialog-overlay" (click)="cancel()">
  <div class="alp-dialog alp-dialog--small" (click)="$event.stopPropagation()">

    <div class="alp-dialog__header">
      <h4>Transfer Call</h4>
      <button type="button" (click)="cancel()" class="alp-dialog__close-btn" aria-label="Close">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="alp-dialog__content">

      <div class="alp-transfer-dialog__section">
        <label class="alp-label" for="TransferCall_Search">Search reasons</label>
        <input
          class="alp-input"
          id="TransferCall_Search"
          type="text"
          placeholder="Search transfer reason..."
          [value]="searchTerm()"
          (input)="searchTerm.set($any($event.target).value)">
      </div>

      <!-- One of a short list of named things, which is the same act a work plan
           asks a rep to perform: a radio in a tile, its state its own rather
           than a class the template has to keep in step. -->
      <fieldset class="alp-transfer-dialog__section">
        <legend class="alp-label">Transfer reason</legend>
        <div class="alp-transfer-dialog__reasons">
          @for (reason of filteredReasons(); track reason.id) {
            <label class="alp-choice">
              <input
                class="alp-choice__input"
                type="radio"
                name="transfer-reason"
                [value]="reason.label"
                [checked]="selectedReason()?.id === reason.id"
                (change)="selectReason(reason)">
              <span class="alp-choice__text">
                <span class="alp-choice__label">{{ reason.label }}</span>
              </span>
            </label>
          }
        </div>
        @if (!filteredReasons().length) {
          <div class="alp-notice alp-notice--info">
            <i aria-hidden="true" class="alp-notice__icon fas fa-info-circle"></i>
            <p class="alp-notice__text">No transfer reason matches that search.</p>
          </div>
        }
      </fieldset>

      <div class="alp-transfer-dialog__section">
        <label class="alp-label" for="TransferCall_Notes">Additional notes (optional)</label>
        <textarea
          class="alp-textarea"
          id="TransferCall_Notes"
          rows="3"
          placeholder="Add any extra context for the receiving agent..."
          [attr.maxlength]="maxNotesLength"
          [value]="notes()"
          (input)="updateNotes($any($event.target).value)">
        </textarea>
        <p class="char-count">{{ notesRemaining() }} of {{ maxNotesLength }} characters remaining</p>
      </div>

    </div>

    <div class="alp-dialog__footer">
      <button type="button" (click)="cancel()" class="alp-btn alp-btn--secondary">Cancel</button>
      <button
        type="button"
        class="alp-btn alp-btn--primary"
        [disabled]="!selectedReason()"
        (click)="confirmTransfer()">
        Transfer Call
      </button>
    </div>

  </div>
</div>

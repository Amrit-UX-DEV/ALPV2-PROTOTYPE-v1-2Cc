<div class="sidebar-content">
    <ul class="sidebar-vertical-steps">


    <!-- ============================================================
         CALL CENTRE JOURNEY STEPS

         Each step is a component whose HOST ELEMENT IS THE <li>, via an
         attribute selector. That keeps the rendered DOM exactly
         <ul class="sidebar-vertical-steps"> > <li class="step-container">.
         Wrapping the <li>s in component tags instead would insert a
         non-<li> child into the <ul> and break the adjacent-sibling
         selectors the stylesheets use between step containers.

         Steps are opened and closed by sidebarStep(this) and advanced by
         toggleAppStep('.from','.to') in prototype-interactions.js. Both
         look elements up globally by class name, so the step classes
         below must stay on these elements.
         ============================================================ -->

    <!-- Step 1 of 5: caller details -->
    <li class="step-container" alpha-caller-details-step></li>

    <!-- Step 2 of 5: DPA / security questions -->
    <li class="step-container" alpha-dpa-step></li>

    <!-- Step 3 of 5: contact information -->
    <li class="step-container" alpha-contact-info-step></li>

    <!-- Step 4 of 5: call information (largest step) -->
    <li class="step-container log-call-information" alpha-call-info-step></li>

    <!-- Step 5 of 5: review / call summary -->
    <li class="step-container" alpha-review-step></li>

    <li hidden="" class="end-step">
        <div class="form-group form-content-center mt-20">

            <button class="btn btn-danger  " alpha-ui-event="click" alpha-ui-attr-toggle=".test,test"> Clear
                &amp; Restart</button>
        </div>

    </li>
    </ul>

    </div>

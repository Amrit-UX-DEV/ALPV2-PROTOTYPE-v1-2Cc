<div class="alp-policy-tile" [class.alp-policy-tile--selected]="selected()">
  <div class="alp-policy-tile__content">
    <div class="alp-policy-tile__block alp-policy-tile__block--reference">
      <span class="alp-policy-tile__heading">Policy Number:</span>
      <span class="alp-policy-tile__number">
        <strong>{{ policy().number }}</strong>
      </span>
    </div>

    <div class="alp-policy-tile__indicators">
      <span class="alp-policy-tile__indicator alp-policy-tile__indicator--status">
        {{ policy().status }}
      </span>
      @for (flag of flags(); track flag) {
        <span class="alp-policy-tile__indicator alp-policy-tile__indicator--pension">{{ flag }}</span>
      }
    </div>

    <div class="alp-policy-tile__block">
      <span class="alp-policy-tile__heading">Company</span>
      <span class="alp-policy-tile__value">
        <strong>{{ policy().company }}</strong>
      </span>
    </div>

    <div class="alp-policy-tile__block">
      <span class="alp-policy-tile__heading">Policy Type</span>
      <span class="alp-policy-tile__value">
        <strong>{{ policy().policyType }}</strong>
      </span>
    </div>

    <div class="alp-policy-tile__block">
      <span class="alp-policy-tile__heading">Product Description</span>
      <span class="alp-policy-tile__value">
        <strong>{{ policy().productName }}</strong>
      </span>
    </div>
  </div>

  @if (actionLabel()) {
    <div class="alp-policy-tile__actions">
      <button type="button" class="alp-btn alp-btn--primary" (click)="action.emit()">
        {{ actionLabel() }}
      </button>
    </div>
  }
</div>

# Kept while Netlify is still wired up. The build command is the same npm
# script every host runs, so no provider has its own idea of how to build this.
[build]
command = "npm run build"
publish = "dist/demo/browser"

# Cloudflare reads src/_redirects, which the build copies into the output and
# which says the same thing as the rule below.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
